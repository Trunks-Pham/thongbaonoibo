name: Update File List

on:
  push:
    paths:
      - 'notifications/**'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate list.json
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const folder = 'notifications';
          const output = path.join(folder, 'list.json');

          const files = fs.readdirSync(folder)
            .filter(f => 
              (f.toLowerCase().endsWith('.pdf') || f.toLowerCase().endsWith('.html')) &&
              f !== 'list.json' &&
              !f.startsWith('.')
            )
            .map(f => ({
              filename: f,
              path: '/notifications/' + encodeURIComponent(f)
            }))
            .sort((a, b) => b.filename.localeCompare(a.filename));

          fs.writeFileSync(output, JSON.stringify(files, null, 2));
          console.log("Generated", output, "→", files.length, "files");
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto update notifications list.json [skip ci]"
          file_pattern: notifications/list.json
          commit_user_name: GitHub Action
          commit_user_email: action@github.com
