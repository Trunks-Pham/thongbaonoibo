<!DOCTYPE html>
<html lang="vi">
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Nội Bộ | Công Ty</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS chính -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- ================== SOCIAL PREVIEW: Facebook, Zalo, Messenger, Twitter ================== -->
    <!-- Open Graph -->
    <meta property="og:site_name" content="Hệ thống Thông Báo Nội Bộ Công Ty">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Thông Báo Nội Bộ">
    <meta property="og:description" content="Xem thông báo, công văn, quyết định mới nhất của công ty — truy cập nhanh, xem trực tuyến, chia sẻ tiện lợi.">
    <meta property="og:image" content="https://thongbaonoibo.onrender.com/assets/images/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://thongbaonoibo.onrender.com">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thông Báo Nội Bộ">
    <meta name="twitter:description" content="Xem thông báo, công văn, quyết định mới nhất của công ty.">
    <meta name="twitter:image" content="https://thongbaonoibo.onrender.com/assets/images/preview.jpg">

    <meta name="theme-color" content="#2563eb">
</head>

<body>
    <!-- Nút menu mobile -->
    <button id="menu-toggle" aria-label="Mở menu" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-bell"></i>
                <h2>Thông Báo</h2>
            </div>
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>

        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Tìm kiếm thông báo..." oninput="filterFiles()" autocomplete="off">
        </div>

        <ul id="file-list">
            <!-- Danh sách file sẽ được JS render -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Thanh link chia sẻ -->
        <div id="file-path-bar" class="path-bar">
            <div class="path-info">
                <i class="fas fa-link"></i>
                <span id="current-path">Đang tải...</span>
            </div>
            <div class="path-actions">
                <button onclick="copyPath()" title="Copy link đầy đủ">
                    <i class="fas fa-copy"></i> Copy
                </button>
                <button id="shorten-btn" onclick="copyShortLink()" title="Tạo link ngắn t.ly">
                    <i class="fas fa-external-link-alt"></i> Link ngắn
                </button>
                <span id="shorten-status"></span>
            </div>
        </div>

        <!-- Nội dung chính -->
        <div id="viewer-container">
            <!-- Trang chủ -->
            <div class="welcome-screen">
                <div class="welcome-content">
                    <i class="fas fa-envelope-open-text welcome-icon"></i>
                    <h1>Chào mừng đến Hệ thống Thông báo</h1>
                    <p>Chọn một thông báo từ menu bên trái để xem chi tiết</p>
                    <a href="#/danh-sach" class="btn-primary">
                        <i class="fas fa-list"></i> Xem danh sách
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/block-devtools.js"></script>
    <script src="./assets/js/auth.js"></script>
</body>
</html>
