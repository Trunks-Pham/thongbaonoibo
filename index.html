<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/image.png">
    <title>Hệ Thống Thông Báo Nội Bộ</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- SOCIAL PREVIEW -->
    <meta property="og:site_name" content="Hệ thống Thông báo Nội bộ">
    <meta property="og:type" content="article">
    <meta property="og:title" id="og-title" content="Thông báo nội bộ">
    <meta property="og:description" id="og-description" content="Xem chi tiết thông báo nội bộ">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="Thông báo nội bộ">
    <meta name="twitter:description" id="twitter-description" content="Xem chi tiết thông báo nội bộ">
    <meta name="twitter:image" id="twitter-image" content="">
</head>
<body>
    <button id="menu-toggle" onclick="toggleMenu()">Menu</button>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Thông Báo Nội Bộ</h2>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Tìm thông báo..." oninput="filterFiles()">
        </div>
        <ul id="file-list">
            <li class="loading">Đang tải danh sách thông báo...</li>
        </ul>
    </div>

    <div id="main-content">
        <div id="file-path-bar" class="path-bar" style="display:none;">
            <strong>Link:</strong>
            <span id="current-path"></span>
            <button onclick="copyPath()" title="Copy link đầy đủ">Copy</button>
            <button onclick="copyShortLink()" title="Tạo & copy link bit.ly" id="shorten-btn" style="margin-left:8px;background:#1da1f2;color:white;border:none;padding:4px 10px;border-radius:4px;font-size:0.85rem;">
                Link 
            </button>
            <span id="shorten-status" style="margin-left:8px;font-size:0.85rem;font-weight:bold;"></span>
        </div>

        <div id="viewer-container">
            <div class="message-box home-screen">
                <h3>Chào mừng bạn đến Hệ thống Thông báo</h3>
                <p>Vui lòng chọn một thông báo từ menu bên trái để xem nội dung.</p>
            </div>
        </div>
    </div>

    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/block-devtools.js"></script>
    <script src="./assets/js/auth.js"></script>
</body>
</html>
